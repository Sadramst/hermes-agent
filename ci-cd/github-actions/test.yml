name: test

on:
  push:
  pull_request:

jobs:
  unit-and-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q -m "not integration"

      - name: Shell syntax
        run: |
          for script in docker/scripts/*.sh ci-cd/scripts/*.sh; do
            bash -n "$script"
          done
