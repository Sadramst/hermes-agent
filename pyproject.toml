[project]
name = "hermes-agent"
version = "0.4.0"
description = "Containerized Hermes Agent with persistent memory, skills, and ChromaDB."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Hermes Agent contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "mcp>=2.3.0,<3",
  "uvicorn>=0.32.0",
  "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[project.scripts]
hermes = "cli.main:console_main"
hermes-api = "api.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires a running ChromaDB service",
]
