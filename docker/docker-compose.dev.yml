name: hermes-dev

services:
  hermes-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: ghcr.io/${GHCR_OWNER:-local}/hermes-agent:${IMAGE_TAG:-dev}
    env_file:
      - env/.env.dev
    environment:
      HERMES_ENV: dev
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      PYTHONPATH: /app/src
    entrypoint: ["uvicorn"]
    command:
      - api.server:serve
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --app-dir
      - /app/src
    ports:
      - "8080:8080"
    volumes:
      - ../src:/app/src
      - ../storage/memory:/app/storage/memory
      - ../storage/skills:/app/storage/skills
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - hermes-net
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  chromadb:
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.0.0}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    networks:
      - hermes-net
    # chromadb/chroma:1.0.0 is a Rust image. It has no python or curl, and it persists at /data.
    healthcheck:
      test: ["CMD", "/usr/lib/apt/apt-helper", "download-file", "http://127.0.0.1:8000/api/v2/heartbeat", "/tmp/chroma-heartbeat"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  hermes-net:
    name: hermes-dev-net

volumes:
  chroma_data:
    name: hermes-dev-chroma
