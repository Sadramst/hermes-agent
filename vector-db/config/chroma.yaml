version: 1
service: chromadb
image: chromadb/chroma:1.0.0
port: 8000
persist_directory: /data
network: hermes-net
heartbeat_paths:
  - /api/v2/heartbeat
  - /api/v1/heartbeat
collection: hermes-documents
auth:
  enabled: true
  token_env: CHROMA_AUTH_TOKEN
  note: "chromadb/chroma:1.0.0 does not enforce tokens. Production checks CHROMA_AUTH_TOKEN in chroma-gate and does not publish the Chroma port."
